[package]
name = "flasharb"
version = "0.1.0"
edition = "2021"
description = "Shadow-mode recorder for Arbitrum DEX arbitrage opportunities (records only, never sends)"
license = "MIT"

[[bin]]
name = "flasharb-shadow"
path = "src/main.rs"

[dependencies]
alloy = { version = "1.8", default-features = false, features = ["std", "provider-http", "rpc-types", "sol-types", "contract", "reqwest-rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
