# FlashArb 側錄器：Ethereum（只記錄、不送單）
# 送單可走 Flashbots 這類打包服務，失敗不付 gas；gas 貴，只有大單才划算。

[chain]
name = "Ethereum"
explorer = "https://etherscan.io"

[rpc]
# 免費公開 RPC；可用環境變數 FLASHARB_RPC_URL 覆蓋
url = "https://ethereum-rpc.publicnode.com"
max_rps = 4
initial_log_range = 50
max_log_range = 1000
timeout_sec = 30

[run]
db_path = "data/ledger.sqlite"
poll_ms = 2000
# 免費 RPC 多半不給舊區塊的資料，所以不補抓，從現在開始記。
# 換成 Alchemy 等有歷史資料的 RPC 後，可以改回 6。
backfill_hours = 0
warmup_minutes = 10

[detect]
# 12 秒一個區塊：50 個區塊約 10 分鐘
stale_blocks = 50
# 主網 gas 貴，只看夠大的單
min_gross_usd = 2.0
gas_cost_usd = 1.0
suspect_gap_pct = 30.0
min_pool_liquidity_usd = 2000.0
max_closer_tx_lookups = 400

[gate]
# 只有「扣完 gas 每天能撿多少」決定結論；另外兩項只當參考
min_addressable_usd_per_day = 1.0
min_median_gross_usd = 0.30
max_same_block_share = 0.5

