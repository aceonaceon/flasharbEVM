# FlashArb 側錄器：Base（只記錄、不送單）
# 失敗的交易要付 gas（金額很小）。拿來檢驗「失敗要付錢 → 套利者比較少」這個假設。

[chain]
name = "Base"
explorer = "https://basescan.org"

[rpc]
# 免費公開 RPC；可用環境變數 FLASHARB_RPC_URL 覆蓋（.env 裡的 FLASHARB_BASE_RPC_URL）
url = "https://base-rpc.publicnode.com"
max_rps = 4
initial_log_range = 20
max_log_range = 500
timeout_sec = 30

[run]
db_path = "data/ledger.sqlite"
poll_ms = 2000
backfill_hours = 6
warmup_minutes = 10

[detect]
# 約 2 秒一個區塊：300 個區塊約 10 分鐘
stale_blocks = 300
min_gross_usd = 0.10
# 成功一筆兩腳套利的 gas（含 L1 資料費）
gas_cost_usd = 0.02
# 失敗一次的 gas（通常在第一個 swap 前就 revert，用得比較少）
fail_cost_usd = 0.005
suspect_gap_pct = 30.0
min_pool_liquidity_usd = 2000.0
max_closer_tx_lookups = 400

[gate]
min_addressable_usd_per_day = 1.0
min_median_gross_usd = 0.30
max_same_block_share = 0.5

