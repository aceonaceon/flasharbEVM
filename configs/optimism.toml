# FlashArb 側錄器：Optimism（只記錄、不送單）
# 失敗的交易要付 gas（金額很小）。拿來檢驗「失敗要付錢 → 套利者比較少」這個假設。

[chain]
name = "Optimism"
explorer = "https://optimistic.etherscan.io"

[rpc]
# publicnode 免費版不給「不指定合約地址」的全鏈事件查詢，所以用 dRPC 的免費公開節點
url = "https://optimism.drpc.org"
max_rps = 3
initial_log_range = 50
max_log_range = 1000
timeout_sec = 30

[run]
db_path = "data/ledger.sqlite"
poll_ms = 2000
# 免費 RPC 多半不給舊區塊的資料，所以不補抓，從現在開始記。
# 換成 Alchemy 等有歷史資料的 RPC 後，可以改回 6。
backfill_hours = 0
warmup_minutes = 10

[detect]
# 約 2 秒一個區塊：300 個區塊約 10 分鐘
stale_blocks = 300
min_gross_usd = 0.10
gas_cost_usd = 0.02
fail_cost_usd = 0.005
suspect_gap_pct = 30.0
min_pool_liquidity_usd = 2000.0
max_closer_tx_lookups = 400

[gate]
min_addressable_usd_per_day = 1.0
min_median_gross_usd = 0.30
max_same_block_share = 0.5

