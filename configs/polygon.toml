# FlashArb 側錄器：Polygon（只記錄、不送單）
# 失敗的交易要付 gas（POL 計價，金額很小）。拿來檢驗「失敗要付錢 → 套利者比較少」這個假設。

[chain]
name = "Polygon"
explorer = "https://polygonscan.com"

[rpc]
url = "https://polygon-bor-rpc.publicnode.com"
max_rps = 4
initial_log_range = 50
max_log_range = 1000
timeout_sec = 30

[run]
db_path = "data/ledger.sqlite"
poll_ms = 2000
backfill_hours = 6
warmup_minutes = 10

[detect]
# 約 2 秒一個區塊：300 個區塊約 10 分鐘
stale_blocks = 300
min_gross_usd = 0.10
gas_cost_usd = 0.01
fail_cost_usd = 0.005
suspect_gap_pct = 30.0
min_pool_liquidity_usd = 2000.0
max_closer_tx_lookups = 400

[gate]
min_addressable_usd_per_day = 1.0
min_median_gross_usd = 0.30
max_same_block_share = 0.5

[tokens]
# 計價與 gas 用的原生幣：WPOL
weth = "0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270"
stables = [
  "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359", # USDC
