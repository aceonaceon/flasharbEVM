# FlashArb 側錄器設定檔（只記錄、不送單）
# 所有門檻都是起始值，看完第一份報表後再調。

[rpc]
# 免費的 Arbitrum 公開 RPC。換成 Alchemy 免費方案的網址會快很多（也可以用環境變數 FLASHARB_RPC_URL 覆蓋）。
url = "https://arb1.arbitrum.io/rpc"
# 每秒最多幾個請求（公開 RPC 有速率限制）
max_rps = 8
# eth_getLogs 一次抓幾個區塊（會自動放大縮小）
initial_log_range = 200
max_log_range = 2000
timeout_sec = 30

[run]
# SQLite 帳本位置（Docker 裡會掛到 ./data）
db_path = "data/ledger.sqlite"
# 多久輪詢一次新區塊（毫秒）
poll_ms = 1000
# 第一次啟動時往回補抓幾小時，讓第一天就有數據（0 = 不補抓）
backfill_hours = 6
# 補抓時，開頭這幾分鐘只建立池子狀態、不記機會
warmup_minutes = 10

[detect]
# 單次套利毛利（已扣兩邊 swap fee）至少多少美元才算「機會」
min_gross_usd = 0.15
# 估計一筆兩腳套利的 gas 成本（美元），用來算淨利
gas_cost_usd = 0.03
# 價差超過這個比例，多半是壞池或價格過時，另外歸類為「可疑」
suspect_gap_pct = 30.0
# 只考慮兩邊池子都至少有這麼多美元流動性（虛擬儲備）
min_pool_liquidity_usd = 2000.0
# 抓幾筆對手套利交易的 priority fee 資料（每筆要多打 2 次 RPC）
max_closer_tx_lookups = 400

[gate]
# 通過門檻：三個條件全部成立才建議進入方案 2（Rust 即時側錄）
min_median_gross_usd = 0.30
# 每天「可爭取的利潤」至少要是主機月費 / 30 的幾倍
min_addressable_usd_per_day = 20.0
# 被吃掉的機會裡，同一個區塊就被吃掉的比例上限（超過代表 Fast Feed 玩家壟斷）
max_same_block_share = 0.5

[tokens]
weth = "0x82aF49447D8a07e3bd95BD0d56f35241523fBab1"
# 視為 1 美元的穩定幣
stables = [
  "0xaf88d065e77c8cC2239327C5EDb3A432268e5831", # USDC
  "0xFF970A61A04b1cA14834A43f5dE4533eBDDB5CC8", # USDC.e
  "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9", # USDT
]
# 主流幣：兩邊都是主流幣的交易對歸為 major，其餘歸為 longtail
majors = [
  "0x82aF49447D8a07e3bd95BD0d56f35241523fBab1", # WETH
  "0xaf88d065e77c8cC2239327C5EDb3A432268e5831", # USDC
  "0xFF970A61A04b1cA14834A43f5dE4533eBDDB5CC8", # USDC.e
  "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9", # USDT
